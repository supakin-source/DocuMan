name: Link a LINE account

# Manual only, and deliberately so: this is the step that decides whose
# expenses a LINE conversation files. It exists as a workflow rather than only
# as `pnpm line:link` because the people who administer this have a browser and
# no terminal, and a linking step nobody can run is a bot nobody can use.
#
# Who may run it is GitHub's answer, not this file's — write access to the
# repository. That is the same bar as changing the code that decides anything
# else here.
on:
  workflow_dispatch:
    inputs:
      email:
        description: "Company e-mail of the account to link"
        required: true
        type: string
      line_user_id:
        description: "LINE user id the bot showed them (starts with U)"
        required: true
        type: string

jobs:
  link:
    name: Link
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Link the account
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        # The script refuses to move a LINE id that already belongs to someone
        # else, so a mistyped id fails here rather than quietly handing one
        # person's claims to another.
        run: pnpm line:link "${{ inputs.email }}" "${{ inputs.line_user_id }}"
