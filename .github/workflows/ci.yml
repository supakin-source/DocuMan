name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the running check obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keeps the two jobs on one Node version without repeating it.
  NODE_VERSION: "22"

jobs:
  check:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        # Version comes from package.json's packageManager field.

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # postinstall runs `prisma generate`, so the client exists from here on.
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      # No secrets needed: src/lib/env.ts validates lazily, so nothing reads the
      # runtime configuration during a build.
      - run: pnpm build

  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: documan
        ports:
          - 5432:5432
        # Steps must not start before the server accepts connections.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # The lifecycle and administration suites run against this database
      # rather than a mock — they are asserting what Postgres actually does
      # with the constraints, the cascades and the sequence row.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/documan?schema=public

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:deploy

      - run: pnpm test
