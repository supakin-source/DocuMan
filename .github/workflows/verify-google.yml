name: Verify Google integrations

# Manual only, and needs an email input: this signs in as a specific person's
# stored Google account (Drive access) and calls the real Gemini API, so it
# must never run on a push or a PR by accident.
on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email of a user who has signed in through the app at least once"
        required: true

jobs:
  verify:
    name: Check Gemini and Drive
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run verify:google
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
          GOOGLE_GENAI_API_KEY: ${{ secrets.GOOGLE_GENAI_API_KEY }}
        run: pnpm verify:google "${{ inputs.email }}"
